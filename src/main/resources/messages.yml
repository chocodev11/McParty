# Thông báo hiển thị cho người chơi của McParty (MiniMessage)
# Tài liệu: https://docs.advntr.dev/minimessage/format.html
# Placeholder dùng dạng <name> (ví dụ: <player>, <id>). Chèn tiền tố bằng {prefix}.

# Nội dung mặc định là màu trắng; chỉ dùng màu cho các thành phần thực sự cần nhấn.
prefix: "<dark_gray>[</dark_gray><#fcca32>McParty</#fcca32><dark_gray>]</dark_gray> <white>"

general:
