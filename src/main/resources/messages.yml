  need-players: "{prefix}Cần ít nhất <min> người chơi."
  already-starting: "{prefix}Party đang bắt đầu hoặc đã bắt đầu."
  no-board-slot: "{prefix}Không có board trống và đã sẵn sàng. Hãy thiết lập bằng /partyadmin."
