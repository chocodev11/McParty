# McParty player-facing messages (MiniMessage)
# Docs: https://docs.advntr.dev/minimessage/format.html
# Placeholders use <name> (e.g. <player>, <id>). Insert prefix with {prefix}.

prefix: "<gray>[</gray><gold>McParty</gold><gray>]</gray> "

general:
  players-only: "{prefix}<red>Players only."
  players-only-except-reload: "{prefix}<red>Players only (except /partyadmin reload)."
  no-permission: "{prefix}<red>No permission."

party:
  already-in: "{prefix}<red>You are already in a party."
  limit-reached: "{prefix}<red>Server party limit reached."
  created: "{prefix}<green>Created party <id> — others: /party join <id>"
  no-open: "{prefix}<red>No open party found."
  already-started: "{prefix}<red>That party already started."
  join-failed: "{prefix}<red>Could not join (full or invalid)."
  joined: "{prefix}<yellow><player> joined (<count>/<max>)"
  not-in: "{prefix}<red>You are not in a party."
  left-self: "{prefix}<gray>You left the party."
  left-broadcast: "{prefix}<gray><player> left."
  host-transferred: "{prefix}<yellow><player> is now the party host."
  only-host-start: "{prefix}<red>Only the host can start."
  need-players: "{prefix}<red>Need at least <min> players."
  already-starting: "{prefix}<red>Party already starting/started."
  no-board-slot: "{prefix}<red>No free ready board slot. Setup with /partyadmin."
  loading-world: "{prefix}<green>Loading world…"
  slime-load-failed: "{prefix}<red>Failed to load slime world (missing template?). Aborting."
  slime-register-failed: "{prefix}<red>Failed to register slime world. Aborting."
  countdown-title: "<yellow><seconds>"
  countdown-subtitle: "<gray>Starting…"
  start-title: "<gold>Go!"
  start-subtitle: "<yellow>Good luck"
  not-found: "{prefix}<red>Party not found."
  not-in-short: "{prefix}<red>Not in a party."
  game-not-running: "{prefix}<red>Game not running."
  not-your-turn: "{prefix}<red>Not your turn."
  slot-invalid: "{prefix}<red>Slot invalid — aborting."
  results-header: "{prefix}<gold>=== Results ==="
  results-line: "<yellow>#<place> <player> — space <space>, <coins> coins"
  list-empty: "{prefix}<gray>No active parties."
  list-header: "{prefix}<gold>Parties:"
  list-entry: "<yellow> - <id> | <state> | <count>p"
  help: "<aqua>/party create|join [id]|leave|start|list|roll|end"

board:
  turn: "{prefix}<aqua><player>'s turn — click the dice (or /party roll)"
  roll-all: "{prefix}<aqua>Everyone roll! Click your dice (or /party roll)"
  rolled-face: "{prefix}<yellow><player> rolled a <roll>"
  rolled: "{prefix}<gold><player> moves <roll> → space <space>"
  round-complete: "{prefix}<light_purple>Round complete — picking minigame…"

minigame:
  dummy-started: "{prefix}<aqua><name> started!"
  dummy-place: "{prefix}<green>Place #<place> (+<coins> coins)"
  # Title during spin; name always on subtitle (spin + center-out expand)
  reveal-spin-title: "<yellow>???"
  # Title after spin lands (name expands on subtitle)
  reveal-ready-title: "<yellow>Get ready!"
  selected: "{prefix}<light_purple>Minigame: <name>"
  hot-potato-started: "{prefix}<gold>Hot Potato! Throw the potato before it explodes!"
  hot-potato-holding: "<red><bold>BOMB TICKING: <seconds>s</bold>"
  hot-potato-exploded: "{prefix}<red><player> exploded!"
  hot-potato-passed: "{prefix}<yellow><from> threw the potato to <to>!"

admin:
  reload-ok: "{prefix}<green>Config reloaded (resource pack restarted). Slime/seamless need a server restart to change."
  reload-failed: "{prefix}<red>Config reload failed — check console."
  slot-usage: "<aqua>/partyadmin slot <list|delete> [id]"
  slot-usage-short: "<aqua>/partyadmin slot <list|delete>"
  slot-delete-usage: "{prefix}<red>Usage: /partyadmin slot delete <id>"
  slot-deleted: "{prefix}<green>Deleted slot."
  slot-not-found: "{prefix}<red>Slot not found."
  slot-none: "{prefix}<green>No slots."
  slot-entry: "{prefix}<green><id> template=<template> ready=<ready> free=<free> path=<path>"
  path-usage: "<aqua>/partyadmin path <create|undo|end|remove|slime> [name] [template]"
  path-create-usage: "{prefix}<red>Usage: /partyadmin path create <name>"
  path-remove-usage: "{prefix}<red>Usage: /partyadmin path remove <name>"
  path-removed: "{prefix}<green>Removed path '<name>' from slots.yml."
  path-not-found: "{prefix}<red>Path '<name>' not found."
  path-slime-usage: "{prefix}<red>Usage: /partyadmin path slime <name> <slime-template>"
  path-slime-missing: "{prefix}<red>Slime template '<template>' not found in the slime worlds folder."
  path-slime-set: "{prefix}<green>Path '<name>' slime template set to '<template>'."
  minigame-usage: "<aqua>/partyadmin minigame <minigame> [player]"
  minigame-not-found: "{prefix}<red>Minigame '<id>' not found."
  player-not-found: "{prefix}<red>Player '<name>' not found or offline."
  minigame-player-required: "{prefix}<red>You must specify a player when running from console."
  minigame-testing: "{prefix}<green>Testing minigame '<name>' solo with player <player>..."
  minigame-test-done: "{prefix}<green>Minigame test completed for <player>."
  help-path: "<aqua>/partyadmin path create <name> | undo | end | remove <name> | slime <name> <template>"
  help-slot: "<aqua>/partyadmin slot list|delete"
  help-minigame: "<aqua>/partyadmin minigame <minigame> [player]"
  parkour-usage: "<aqua>/partyadmin parkour <start|checkpoint|goal|remove-checkpoint|clear>"
  parkour-start-set: "{prefix}<green>Parkour start set beneath your feet."
  parkour-checkpoint-added: "{prefix}<green>Parkour checkpoint #<count> added beneath your feet."
  parkour-goal-set: "{prefix}<green>Parkour goal set beneath your feet."
  parkour-remove-checkpoint-usage: "{prefix}<red>Usage: /partyadmin parkour remove-checkpoint <number>"
  parkour-checkpoint-removed: "{prefix}<green>Removed parkour checkpoint #<index>."
  parkour-checkpoint-not-found: "{prefix}<red>Parkour checkpoint #<index> does not exist."
  parkour-cleared: "{prefix}<green>Lobby parkour cleared."
  help-parkour: "<aqua>/partyadmin parkour start|checkpoint|goal|remove-checkpoint <number>|clear"
  help-reload: "<aqua>/partyadmin reload"

parkour:
  started: "{prefix}<green>Parkour started!"
  checkpoint-reached: "{prefix}<yellow>Checkpoint reached."
  restarted: "{prefix}<yellow>Run restarted."
  finished: "{prefix}<gold>Parkour complete!"
  left: "{prefix}<gray>You left the parkour."
  item-restart: "<yellow>Restart Run"
  item-checkpoint: "<aqua>Teleport Checkpoint"
  item-leave: "<red>Leave Parkour"

path:
  already-setup: "{prefix}<red>Already setting up a path. Use /partyadmin path end or undo."
  name-required: "{prefix}<red>Path name required."
  name-invalid: "{prefix}<red>Invalid name. Use letters, numbers, _ or -."
  board-exists: "{prefix}<red>Board '<name>' already exists. Delete it first."
  started: "{prefix}<green>Path setup '<name>' started. First break = spawn (no pad), then break blocks for path spaces."
  wrong-world: "{prefix}<red>Space must be in the same world as path setup."
  spawn-placed: "{prefix}<green>Spawn set (no pad). Players will appear within 4 blocks. Now place path spaces."
  space-placed: "{prefix}<green>Space #<index> placed (<total> total)."
  not-setup: "{prefix}<red>Not setting up a path. Use /partyadmin path create <name>."
  nothing-to-undo: "{prefix}<red>Nothing to undo."
  undid: "{prefix}<green>Undid last space (<left> left)."
  undid-spawn: "{prefix}<green>Cleared spawn. Break a block to set spawn again."
  need-spawn: "{prefix}<red>Set spawn first (first Path Stick break, no pad)."
  need-space: "{prefix}<red>Add at least one path space with the Path Stick before ending."
  board-exists-end: "{prefix}<red>Board '<name>' already exists."
  saved: "{prefix}<green>Path '<name>' saved with <count> space(s). Slime template can be set after generation."
  cancelled: "{prefix}<red>Path setup cancelled; pads restored."
  stick-name: "<gold>Path Stick"
  stick-lore-1: "<gray>1st break: spawn (no pad). Then: path spaces"
  stick-lore-2: "<dark_gray>/partyadmin path undo | end"

resource-pack:
  prompt: "McParty needs this pack for custom dice models."
  kick: "You must accept the McParty resource pack."
  declined: "{prefix}<yellow>Resource pack declined — dice may look like plain paper."
  failed: "{prefix}<yellow>Resource pack failed (<reason>). Dice may look like plain paper."
