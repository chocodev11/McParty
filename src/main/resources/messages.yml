  spleef-multishot: "<#fcca32>Multishot:</#fcca32> <white><seconds> giây</white>"
  elytra-started: "{prefix}Đua Elytra! Bay qua tất cả <rings> vòng; vòng cuối là đích."
  elytra-ring: "{prefix}Vòng <ring>/<total>"
  elytra-center: "{prefix}Bay chính giữa hoàn hảo! +<coins> xu"
