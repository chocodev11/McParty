name: McParty
version: '${version}'
main: dev.epicc.McPartyPlugin
description: Mario Party-style multiplayer minigame system
api-version: '26.1.2'
load: POSTWORLD
authors: [McParty]
softdepend: [packetevents, Multiverse-Core]

commands:
  party:
    description: Party room commands
    usage: /party <create|join|leave|start|list|end|roll>
    permission: mcparty.party
  partyadmin:
    description: Board, minigame, and lobby parkour setup admin commands
    usage: /partyadmin <path|slot|minigame|setlobby|parkour <start|checkpoint|goal|leaderboard|remove-checkpoint|clear>|reload>
    permission: mcparty.admin
    aliases: [padmin]

permissions:
  mcparty.party:
    description: Create and join party rooms
    default: true
  mcparty.admin:
    description: Admin board setup and force end
    default: op
  mcparty.admin.bypass:
    description: Bypass slot boundary
    default: op
