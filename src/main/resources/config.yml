party:
  min-players: 1
  max-players: 8
  max-instances: 12
  start-countdown-seconds: 5
  starting-coins: 3

board:
  dice-min: 1
  dice-max: 6
  # Visual dice (ItemDisplay). Needs resource pack mcparty:dice_1..6
  # Stops only on click or this timeout (everyone rolls each round)
  dice-interact-seconds: 10
  # Face-texture shuffle interval while the die tumbles at a fixed smooth rate
  dice-spin-interval-ticks: 4
  dice-spawn-distance: 2.5
  # Rolling and settled dice size — keep smaller so first-person does not look huge
  dice-spin-scale: 0.7
  # Public hat above head (larger than the old 0.35)
  dice-hat-scale: 0.8
  # Path hop: upward velocity → when vy≤0 TP to target XZ at its configured Y + 15, then fall
  # ~1.70 ≈ 15-block apex under vanilla living gravity/drag
  hop-up-velocity: 1.70
  hop-rise-max-seconds: 3
  hop-fall-max-seconds: 6

minigame:
  dummy-duration-seconds: 5
  dummy-coin-rewards:
    - 10
    - 7
    - 5
    - 3
  hot_potato:
    slime-template: hot_potato_arena
    bomb-seconds: 20
    throw-velocity: 0.9
    max-cycles: 10
    # Template-relative arena definition. Invalid/missing values disable only Hot Potato.
    arena:
      template: hot_potato_arena
      spawn:
        x: 0.5
        y: 64.0
        z: 0.5
        yaw: 0.0
        pitch: 0.0
      boundary:
        minX: -50
        minY: 0
        minZ: -50
        maxX: 50
        maxY: 256
        maxZ: 50

  spleef:
    arena:
      template: spleef_arena
      spawn:
        x: 0.5
        y: 70.0
        z: 0.5
        yaw: 0.0
        pitch: 0.0
      boundary:
        minX: -40
        minY: 40
        minZ: -40
        maxX: 40
        maxY: 140
        maxZ: 40
    timeout-seconds: 90
    fall-y: 60.0
    spawn-radius: 7.0
    floor-materials:
      - TNT
    powerup:
      # Spawn a Multishot power-up above a remaining TNT block.
      spawn-interval-seconds: 10
      multishot-duration-seconds: 10
      # Item model id under the mcparty namespace.
      item-model: tnt_multishot

  elytra_race:
    # Course definitions are stored in plugins/McParty/elytra-courses.yml.
    course: default
    timeout-seconds: 120
    center-bonus-coins: 2
    default-ring-radius: 3.0

# Suppress dirt "Loading terrain…" on lobby↔board party teleports (same env + height).
# Requires PacketEvents plugin on the server. Fail-open if missing.
seamless-world-change:
  enabled: true

# Dice models (mcparty:dice_1..6). Modes: local (plugin HTTP) or external (CDN URL).
resource-pack:
  enabled: true
  # local | external
  mode: local
  # join = every login; party = /party create or join only
  send-on: join
  required: true
  kick-on-decline: false
  # Ticks after join/party action before sending (client ready)
  send-delay-ticks: 20
  # prompt / kick text: messages.yml → resource-pack.prompt / resource-pack.kick

  # mode: external — direct HTTPS zip URL (client must reach it)
  external:
    url: ""
    # 40-char lowercase SHA-1 of the zip (required for external)
    sha1: ""

  # mode: local — zip the pack bundled in the plugin JAR, write to plugins/McParty/output/, serve HTTP
  local:
    # Written as plugins/McParty/output/<zip-name>
    zip-name: mcparty.zip
    bind: "0.0.0.0"
    port: 31232
    # Full URL clients use. Required for remote players (not 127.0.0.1).
    # Example: http://play.example.com:8163/mcparty.zip
    public-url: "http://160.250.134.179:31232/mcparty.zip"

# Component-based tab-list rendering. Values use MiniMessage and support the
# same placeholders as messages.yml, including <player>, <party>, and <coins>.
tablist:
  enabled: true
  # Only list players who belong to the viewer's current party.
  party-only: true
  # Dynamic placeholders and party membership are refreshed at this interval.
  refresh-ticks: 20
  header: "<white>Chào mừng đến <#fcca32><bold>McParty</bold></#fcca32>!</white>"
  player-name: "<gray>MEMBER</gray> <gray>|</gray> <dark_gray><player></dark_gray>"
  # Leave blank to use player-name for party hosts too.
  host-player-name: "<aqua><bold>HOST</bold></aqua> <gray>|</gray> <aqua><player></aqua>"
  # Change these addresses to the public addresses of this server.
  footer: |-
    <#fcca32>kingmc.vn

# Persistent plugin data. The SQLite file is created relative to plugins/McParty.
# Parkour records use a versioned schema so another JDBC backend can replace it later.
database:
  sqlite-file: parkour.db

# AdvancedSlimePaper — per-party world load/unload
# Place templates as: plugins/McParty/<worlds-directory>/<name>.slime
# Path setup does not assign slime-template; slots may leave it empty and use template-world
# until a template is generated and written to slots.yml.
slime:
  enabled: true
  worlds-directory: slime_worlds
  template-world: party_board
  world-prefix: party-
  allow-monsters: false
  allow-animals: false
  pvp: true
  # Persistent safe destination used before any party clone is unloaded.
  fallback:
    world: world
    x: 0.5
    y: 64.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

lobby:
  slime-template: lobby_template
  spawn:
    x: 0.5
    y: 75.0
    z: -56.5
    yaw: 0.0
    pitch: 0.0
  boundary:
    minX: -50
    minY: 0
    minZ: -50
    maxX: 50
    maxY: 256
    maxZ: 50
  parkour:
    course-id: lobby
    world: lobby
    start:
      x: 8
      y: 73
      z: -38
    checkpoints:
      - x: 6
        y: 82
        z: -16
      - x: -4
        y: 90
        z: -34
    goal:
      x: 0
      y: 95
      z: -14
    leaderboard:
      x: 0
      y: 158
      z: 2

holograms:
  enabled: true
  file: holograms.yml
  # How often player/world visibility is recalculated.
  view-scan-interval-ticks: 5
  default-view-range: 32.0
