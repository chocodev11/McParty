party:
  min-players: 1
  max-players: 8
  max-instances: 12
  start-countdown-seconds: 5
  max-turns: 4
  starting-coins: 10

board:
  dice-min: 1
  dice-max: 6
  # Visual dice (ItemDisplay). Needs resource pack mcparty:dice_1..6
  # Stops only on click or this timeout (everyone rolls each round)
  dice-interact-seconds: 10
  # Face-texture shuffle interval while the die tumbles at a fixed smooth rate
  dice-spin-interval-ticks: 4
  dice-spawn-distance: 2.0
  # Settle / world size (cube ~14/16 tall; 1.0 = 1:1 on ItemDisplay NONE)
  dice-display-scale: 1.0
  # Spin (in front of eyes) — keep smaller so first-person does not look huge
  dice-spin-scale: 0.7
  # Public hat above head (larger than the old 0.35)
  dice-hat-scale: 0.8
  # Path hop: upward velocity → when vy≤0 TP to target XZ at its configured Y + 15, then fall
  # ~1.70 ≈ 15-block apex under vanilla living gravity/drag
  hop-up-velocity: 1.70
  hop-rise-max-seconds: 3
  hop-fall-max-seconds: 6

minigame:
  dummy-duration-seconds: 5
  dummy-coin-rewards:
    - 10
    - 7
    - 5
    - 3
  # Title roulette before minigame starts (players stay in place — no teleport)
  # Spin: subtitle swaps fast then slows (min→max interval), then lands on winner
  reveal-duration-ticks: 60
  reveal-interval-min-ticks: 2
  reveal-interval-max-ticks: 14
  # After spin: chosen name expands middle → sides on subtitle (ticks per letter step)
  reveal-expand-interval-ticks: 4
  # Full name tint white → yellow (few steps, longer pause between)
  reveal-color-steps: 5
  reveal-color-interval-ticks: 3

  hot_potato:
    slime-template: hot_potato_arena
    bomb-seconds: 20
    throw-velocity: 0.9
    max-cycles: 10
    # Template-relative arena definition. Invalid/missing values disable only Hot Potato.
    arena:
      template: hot_potato_arena
      spawn:
        x: 0.5
        y: 64.0
        z: 0.5
        yaw: 0.0
        pitch: 0.0
      boundary:
        minX: -50
        minY: 0
        minZ: -50
        maxX: 50
        maxY: 256
        maxZ: 50

  spleef:
    arena:
      template: spleef_arena
      spawn:
        x: 0.5
        y: 70.0
        z: 0.5
        yaw: 0.0
        pitch: 0.0
      boundary:
        minX: -40
        minY: 40
        minZ: -40
        maxX: 40
        maxY: 140
        maxZ: 40
    timeout-seconds: 90
    fall-y: 60.0
    spawn-radius: 7.0
    floor-materials:
      - SNOW_BLOCK
      - POWDER_SNOW

# Suppress dirt "Loading terrain…" on party world teleports (same env + height).
# Requires PacketEvents plugin on the server. Fail-open if missing.
seamless-world-change:
  enabled: true

# Dice models (mcparty:dice_1..6). Modes: local (plugin HTTP) or external (CDN URL).
resource-pack:
  enabled: true
  # local | external
  mode: local
  # join = every login; party = /party create or join only
  send-on: join
  required: true
  kick-on-decline: false
  # Ticks after join/party action before sending (client ready)
  send-delay-ticks: 20
  # prompt / kick text: messages.yml → resource-pack.prompt / resource-pack.kick

  # mode: external — direct HTTPS zip URL (client must reach it)
  external:
    url: ""
    # 40-char lowercase SHA-1 of the zip (required for external)
    sha1: ""

  # mode: local — zip plugins/McParty/<source-folder>, write zip to plugins/McParty/output/, serve HTTP
  local:
    # Relative to plugin data folder; bundled pack is extracted here if missing
    source-folder: resourcepack
    # Written as plugins/McParty/output/<zip-name>
    zip-name: mcparty.zip
    bind: "0.0.0.0"
    port: 8163
    # Full URL clients use. Required for remote players (not 127.0.0.1).
    # Example: http://play.example.com:8163/mcparty.zip
    public-url: ""

# Persistent plugin data. The SQLite file is created relative to plugins/McParty.
# Parkour records use a versioned schema so another JDBC backend can replace it later.
database:
  sqlite-file: parkour.db

# AdvancedSlimePaper — per-party world load/unload
# Place templates as: plugins/McParty/<worlds-directory>/<name>.slime
# Path setup does not assign slime-template; slots may leave it empty and use template-world
# until a template is generated and written to slots.yml.
slime:
  enabled: true
  worlds-directory: slime_worlds
  template-world: party_board
  world-prefix: party-
  allow-monsters: false
  allow-animals: false
  pvp: true
  # Persistent safe destination used before any party clone is unloaded.
  fallback:
    world: world
    x: 0.5
    y: 64.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0

lobby:
  slime-template: lobby_template
  spawn:
    x: 0.5
    y: 64.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0
  boundary:
    minX: -50
    minY: 0
    minZ: -50
    maxX: 50
    maxY: 256
    maxZ: 50
  # Start and checkpoints are pressure plates; the goal is an entity. Set while standing on each location:
  # /partyadmin parkour start|checkpoint|goal|leaderboard
  parkour:
    # Stable identifier used by the leaderboard store; change only when creating a separate course.
    course-id: lobby
    # Permanent MCA lobby world used when Slime is unavailable. Commands set this automatically.
    world: ""
    start: null
    checkpoints: []
    goal: null
    leaderboard: null

holograms:
  enabled: true
  file: holograms.yml
  # How often player/world visibility is recalculated.
  view-scan-interval-ticks: 5
  default-view-range: 32.0
