party:
  min-players: 1
  max-players: 8
  max-instances: 12
  start-countdown-seconds: 5
  max-turns: 4
  starting-coins: 10

board:
  dice-min: 1
  dice-max: 6
  # Visual dice (ItemDisplay + Interaction). Needs resource pack mcparty:dice_1..6
  dice-interact-seconds: 5
  # Face/transform update rate while spinning (8 = 2.5 swaps/sec)
  dice-spin-interval-ticks: 8
  dice-spawn-distance: 2.0
  dice-display-scale: 0.6
  dice-hat-scale: 0.35
  # Path hop: upward velocity → when vy≤0 keep that Y, TP to target XZ, then fall
  hop-up-velocity: 0.85
  hop-rise-max-seconds: 3
  hop-fall-max-seconds: 4

minigame:
  dummy-duration-seconds: 5
  dummy-coin-rewards:
    - 10
    - 7
    - 5
    - 3
  # Title roulette before minigame starts (players stay in place — no teleport)
  # Spin: subtitle swaps fast then slows (min→max interval), then lands on winner
  reveal-duration-ticks: 60
  reveal-interval-min-ticks: 2
  reveal-interval-max-ticks: 14
  # After spin: chosen name title expands middle → sides (ticks per letter step)
  reveal-expand-interval-ticks: 2

# Suppress dirt "Loading terrain…" on party world teleports (same env + height).
# Requires PacketEvents plugin on the server. Fail-open if missing.
seamless-world-change:
  enabled: true

# Dice models (mcparty:dice_1..6). Modes: local (plugin HTTP) or external (CDN URL).
resource-pack:
  enabled: true
  # local | external
  mode: local
  # join = every login; party = /party create or join only
  send-on: join
  required: true
  kick-on-decline: false
  # Ticks after join/party action before sending (client ready)
  send-delay-ticks: 20
  # prompt / kick text: messages.yml → resource-pack.prompt / resource-pack.kick

  # mode: external — direct HTTPS zip URL (client must reach it)
  external:
    url: ""
    # 40-char lowercase SHA-1 of the zip (required for external)
    sha1: ""

  # mode: local — zip plugins/McParty/<source-folder>, write zip to plugins/McParty/output/, serve HTTP
  local:
    # Relative to plugin data folder; bundled pack is extracted here if missing
    source-folder: resourcepack
    # Written as plugins/McParty/output/<zip-name>
    zip-name: mcparty.zip
    bind: "0.0.0.0"
    port: 8163
    # Full URL clients use. Required for remote players (not 127.0.0.1).
    # Example: http://play.example.com:8163/mcparty.zip
    public-url: ""

# AdvancedSlimePaper — per-party world load/unload
# Place template as: plugins/McParty/<worlds-directory>/<template-world>.slime
slime:
  enabled: true
  worlds-directory: slime_worlds
  template-world: party_board
  world-prefix: party-
  allow-monsters: false
  allow-animals: false
  pvp: true
