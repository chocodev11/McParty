  dice_6:
    texture: item/dice_6.png
    scale: 16
    y-position: 12
    codepoint: E006
  background:
    texture: misc/background.png
    scale: 256
    # The vanilla title baseline is 10 pixels above screen center.
    y-position: 118
    codepoint: E007
  logo:
    texture: misc/logo.png
    scale: 112
    # The vanilla subtitle baseline is 5 pixels below screen center.
    y-position: 65
    # Compensate for transparent left padding counted by bitmap-font glyph width.
    x-offset: -18
    codepoint: E008
